site_name: CW — Codex Workflow
site_url: https://docs.cwcli.dev
site_description: Bounded, gate-driven AI-assisted software development workflows.
site_author: Queopius
repo_url: https://github.com/Queopius/cw
repo_name: Queopius/cw

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/brand/cw-mark.png
  favicon: assets/brand/cw-mark-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Getting Started: getting-started.md
      - Planning: planning.md
      - Workflow: workflow.md
      - CLI Reference: cli-reference.md
  - Core Workflow:
      - Gates and Reviews: gates-and-reviews.md
      - Completion Contracts: completion-contracts.md
      - Batch Execution: batch-execution.md
      - Live Execution: live-execution.md
      - Integrations: integrations.md
  - Operations:
      - Configuration: configuration.md
      - Updating: updating.md
      - Troubleshooting: troubleshooting.md
      - Error Reference: errors.md
  - Engineering:
      - Architecture: architecture.md
      - Plugin Readiness: plugin-readiness.md
      - MCP Runtime: mcp-runtime.md
      - MCP Tool Contract: mcp-tool-contract.md
      - Plugin / App Candidate: plugin-app-candidate.md
      - ChatGPT Development: chatgpt-development.md
      - ChatGPT 0.11 Acceptance: acceptance/chatgpt-development-0.11.md
      - Plugin Production Readiness: plugin-production-readiness.md
      - Plugin Authentication: plugin-auth.md
      - Plugin Deployment: plugin-deployment.md
      - Plugin Submission: plugin-submission.md
      - ChatGPT Plugin 0.12 Acceptance: acceptance/chatgpt-plugin-0.12.md
      - Remote Gateway: remote-gateway.md
      - Remote Agent: remote-agent.md
      - Remote Authentication: remote-auth.md
      - Remote Pairing: remote-pairing.md
      - Remote Project Grants: remote-project-grants.md
      - Remote Security: remote-security.md
      - Remote Privacy: remote-privacy.md
      - Remote Operations: remote-operations.md
      - Remote Gateway 0.13 Acceptance: acceptance/remote-gateway-0.13.md
      - Plugin Listing Draft: plugin-listing-draft.md
      - Plugin Privacy Draft: plugin-privacy.md
      - Plugin Support: plugin-support.md
      - Plugin Security Review: plugin-security.md
      - ADR — Multi-adapter Engine: adr/0001-multi-adapter-engine.md
      - ADR — MCP Transport: adr/0002-mcp-transport.md
      - ADR — Plugin Candidate: adr/0003-plugin-candidate.md
      - ADR — ChatGPT Development: adr/0004-chatgpt-development-and-public-runtime.md
      - ADR — Production MCP Relay: adr/0005-production-mcp-relay.md
      - ADR — Gateway Agent Transport: adr/0006-gateway-agent-long-poll.md
      - ADR — Remote Identity Provider: adr/0007-remote-identity-provider.md
      - ADR — Device Identity and Pairing: adr/0008-device-identity-pairing.md
      - ADR — Remote Persistence: adr/0009-remote-persistence.md
      - Project Layout: project-layout.md
      - Platform Support: testing/platform-support.md
      - Windows VM Acceptance: testing/windows-vm-acceptance.md
      - Security: security.md
      - Release Process: release-process.md
  - Project:
      - Brand Assets: assets/brand/README.md

edit_uri: ""

extra_css:
  - stylesheets/brand.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://cwcli.dev
      name: CW product website
    - icon: fontawesome/brands/github
      link: https://github.com/Queopius/cw
      name: CW source on GitHub

copyright: Copyright 2026 Fantomid LLC · CW by Queopius · Apache-2.0

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
