site_name: CW — Codex Workflow
site_url: https://docs.cwcli.dev
site_description: Bounded, gate-driven AI-assisted software development workflows.
site_author: Queopius
repo_url: https://github.com/Queopius/cw
repo_name: Queopius/cw

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/brand/cw-mark.png
  favicon: assets/brand/cw-mark-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Getting Started: getting-started.md
      - Planning: planning.md
      - Workflow: workflow.md
      - CLI Reference: cli-reference.md
  - Core Workflow:
      - Gates and Reviews: gates-and-reviews.md
      - Batch Execution: batch-execution.md
      - Live Execution: live-execution.md
      - Integrations: integrations.md
  - Operations:
      - Configuration: configuration.md
      - Updating: updating.md
      - Troubleshooting: troubleshooting.md
      - Error Reference: errors.md
  - Engineering:
      - Architecture: architecture.md
      - Project Layout: project-layout.md
      - Platform Support: testing/platform-support.md
      - Windows VM Acceptance: testing/windows-vm-acceptance.md
      - Security: security.md
      - Release Process: release-process.md
  - Project:
      - Brand Assets: assets/brand/README.md

edit_uri: ""

extra_css:
  - stylesheets/brand.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://cwcli.dev
      name: CW product website
    - icon: fontawesome/brands/github
      link: https://github.com/Queopius/cw
      name: CW source on GitHub

copyright: Copyright 2026 Fantomid LLC · CW by Queopius · Apache-2.0

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
