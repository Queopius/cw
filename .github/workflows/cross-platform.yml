name: Platform Acceptance

on:
  push:
    branches: [dev, staging, release, prod]
  pull_request:
    branches: [dev, staging, release, prod]

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            installer: posix
          - name: Windows x86_64
            runner: windows-2025
            installer: windows
          - name: macOS arm64
            runner: macos-15
            installer: posix
          - name: macOS Intel
            runner: macos-15-intel
            installer: posix
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the verified Codex Plugin CLI
        run: npm install --global @openai/codex@0.148.0
      - name: Run native platform and fake-Codex contract tests
        run: python -m unittest tests.test_platform tests.test_fake_codex
      - name: Run platform-neutral MCP stdio and controlled-action contract tests
        env:
          CW_TEST_GIT_MARKETPLACE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m pip install ".[remote]"
          python -m unittest tests.test_mcp_runtime tests.test_mcp_actions tests.test_plugin_candidate tests.test_plugin_installation tests.test_plugin_hardening tests.test_chatgpt_development tests.test_plugin_production_readiness
          python -m unittest tests.test_remote_gateway
          python -m unittest tests.test_plan_amendment tests.test_plan_revisions
          python -m unittest tests.test_staging_bootstrap
          python scripts/run_mcp_acceptance.py
          python scripts/validate_plugin_candidate.py
          python scripts/validate_plugin_production_readiness.py
          python scripts/validate_staging_bootstrap.py
          python scripts/build_plugin_candidate.py --check
      - name: Test managed POSIX installer in isolation
        if: matrix.installer == 'posix'
        shell: bash
        run: |
          export CW_INSTALL_ROOT="$RUNNER_TEMP/cw-managed"
          export CW_BIN_DIR="$RUNNER_TEMP/cw-bin"
          ./install.sh
          "$CW_BIN_DIR/cw" version --json
          "$CW_BIN_DIR/cw" --version
          echo "$CW_BIN_DIR" >> "$GITHUB_PATH"
      - name: Test native PowerShell installer in isolation
        if: matrix.installer == 'windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "cw-managed"
          $bin = Join-Path $env:RUNNER_TEMP "cw-bin"
          ./install.ps1 -InstallRoot $root -BinDir $bin -NoPathUpdate
          & (Join-Path $bin "cw.cmd") version --json
          & (Join-Path $bin "cw.cmd") --version
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Verify managed command in a fresh step
        run: |
          cw version --verbose
          cw --version
          cw help
          cw plan amend --help
      - name: Run installed-wheel deterministic acceptance
        run: python scripts/run_acceptance.py --output artifacts/compatibility-report.json
      - name: Upload sanitized compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.name }}
          path: |
            artifacts/compatibility-report.json
            artifacts/compatibility-diagnostic.json
          if-no-files-found: warn
