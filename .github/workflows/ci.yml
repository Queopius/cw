name: CI

on:
  push:
    branches: [dev, staging, release, prod]
  pull_request:
    branches: [dev, staging, release, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        run: make check

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
          python scripts/build_plugin_candidate.py --output "dist/cw-plugin-$(cat VERSION).zip"
      - name: Verify installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cw version --json
          python -c "import sys; import cw.core, cw.application; assert 'mcp' not in sys.modules"
          wheel=$(ls dist/*.whl)
          python -m pip install --force-reinstall "${wheel}[mcp]"
          python -c "from cw.adapters.mcp.server import create_server"
          python scripts/run_mcp_acceptance.py
          python -m pip install --force-reinstall "${wheel}[remote]"
          python -c "from cw.remote.server import create_gateway_app; from cw.remote.agent import HTTPAgentClient"
          python -m unittest tests.test_remote_gateway
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cw-distributions
          path: dist/*
          if-no-files-found: error

  mcp:
    name: MCP governed protocol and actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install MCP extra and run protocol/security tests
        run: |
          python -m pip install ".[mcp]"
          python -m unittest tests.test_mcp_runtime tests.test_mcp_actions tests.test_chatgpt_development -v

  remote:
    name: Remote gateway, OAuth, and agent contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install remote extra and run gateway security/E2E tests
        run: |
          python -m pip install ".[remote]"
          python -m unittest tests.test_remote_gateway tests.test_staging_bootstrap -v
          python scripts/validate_staging_bootstrap.py

      - name: Build portable staging container
        run: docker build --tag cw-staging:${{ github.sha }} .

  plugin:
    name: Plugin candidate contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate package, skill, permissions, security, and parity
        run: |
          python scripts/validate_plugin_candidate.py
          python scripts/validate_plugin_production_readiness.py
          python scripts/validate_remote_candidate.py
          python scripts/validate_staging_bootstrap.py
          python scripts/build_plugin_candidate.py --check
          python -m unittest tests.test_plugin_candidate tests.test_chatgpt_development tests.test_plugin_production_readiness -v

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
      - name: Validate CLI reference
        run: |
          python scripts/check_cli_docs.py
          python scripts/check_error_docs.py
          python scripts/check_doc_links.py
          python scripts/check_docs_policy.py
          python scripts/check_public_version.py
      - name: Validate committed real-workflow hero demo
        run: make demo-check
