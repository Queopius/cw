name: Read the Docs stable alias sync

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release tag (defaults to v<VERSION>)
        required: false
      trigger_build:
        description: Rebuild when the version is already active
        required: false
        default: "true"
      project:
        description: Read the Docs project slug
        required: false
        default: cw-codex-workflow

permissions:
  contents: read

jobs:
  sync-stable:
    name: Sync RTD stable alias
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require RTD token
        run: |
          if [ -z "${READTHEDOCS_TOKEN:-}" ]; then
            echo "READTHEDOCS_TOKEN secret is required." >&2
            exit 1
          fi
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}

      - name: Sync stable alias
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="v$(tr -d '\n' < VERSION)"
          fi
          args=(--project "${{ github.event.inputs.project }}" --alias stable --version "$version")
          if [ "${{ github.event.inputs.trigger_build }}" = "true" ]; then
            args+=(--trigger-build)
          fi
          python3 scripts/sync_readthedocs_stable.py "${args[@]}"
