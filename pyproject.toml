[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-workflow"
dynamic = ["version"]
description = "CW by Queopius — plan, build, validate, and review software one verified phase at a time."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Fantomid LLC"}]
keywords = ["cw", "codex", "workflow", "queopius"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.29,<2"]
remote = [
  "mcp>=1.29,<2",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://cwcli.dev"
Documentation = "https://docs.cwcli.dev"
Repository = "https://github.com/Queopius/cw.git"
Issues = "https://github.com/Queopius/cw/issues"

[project.scripts]
cw = "cw.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
include = ["cw*"]

[tool.setuptools.package-data]
cw = [
  "application/*.json",
  "schemas/*.json",
  "schemas/codex/*.json",
  "release_history.json",
  "templates/*.md",
  "templates/.codex/*.json",
  "templates/.codex/hooks/*.py",
  "templates/.codex/prompts/*.md",
  "templates/.codex/schemas/*.json",
]
