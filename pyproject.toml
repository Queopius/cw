[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-workflow"
version = "0.1.2"
description = "CW by Queopius — plan, build, validate, and review software one verified phase at a time."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Fantomid LLC"}]
keywords = ["cw", "codex", "workflow", "queopius"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Queopius/cw"
Repository = "https://github.com/Queopius/cw.git"
Issues = "https://github.com/Queopius/cw/issues"

[project.scripts]
cw = "cw.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cw*"]

[tool.setuptools.package-data]
cw = [
  "schemas/*.json",
  "templates/*.md",
  "templates/.codex/*.json",
  "templates/.codex/hooks/*.py",
  "templates/.codex/prompts/*.md",
  "templates/.codex/schemas/*.json",
]
